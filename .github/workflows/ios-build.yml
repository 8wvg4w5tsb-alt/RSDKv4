
name: Build RSDKv4 iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version
      - name: Create temporary game data placeholder
        run: |
          mkdir -p dependencies/ios
          touch dependencies/ios/Data.rsdk
      - name: Build iOS app
        run: |
          xcodebuild \
            -project "RSDKv4 ios.xcodeproj" \
            -scheme "RSDKv4" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/RSDKv4.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr RSDKv4-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv4-iOS
          path: RSDKv4-unsigned.ipa
